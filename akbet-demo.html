@media (prefers-reduced-motion: no-preference) { .odd { transition: background .12s, border-color .12s; } }
.langs { display: flex; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; overflow: hidden; }

@media (max-width: 420px) { .top-in { height: auto; padding-block: 8px; flex-wrap: wrap; } .brand { font-size: 22px; } }

  const pois = (k, l) => { let f = 1; for (let i = 2; i <= k; i++) f *= i; return Math.exp(-l) * l ** k / f; };
  function xg(hr, ar) { const d = (hr - ar) / 50; return { h: r2(1.35 * Math.exp(d) * 1.12), a: r2(1.35 * Math.exp(-d) / 1.12) }; }
  function oddsFor(lh, la) {
    const p = { "1": 0, X: 0, "2": 0, O: 0, U: 0, GG: 0, NG: 0 };
    for (let h = 0; h <= 15; h++) for (let a = 0; a <= 15; a++) {
      const q = pois(h, lh) * pois(a, la);
      p[h > a ? "1" : h === a ? "X" : "2"] += q;
      p[h + a > 2.5 ? "O" : "U"] += q;
      p[h > 0 && a > 0 ? "GG" : "NG"] += q;
    }
    const o = {}; for (const k in p) o[k] = Math.max(1.01, r2(1 / (p[k] * 1.06))); return o;
  }
  const wins = (s, h, a) => ({ "1": h > a, X: h === a, "2": h < a, O: h + a > 2.5, U: h + a < 2.5, GG: h > 0 && a > 0, NG: h === 0 || a === 0 })[s];
  function samplePois(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }

  // ---- state ----
  let S;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function load() { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.matches) return v; } catch (e) {} return null; }
  function newRound() {
    const slots = [15, 17, 18, 19, 20, 21];
    for (const [league, teams] of Object.entries(LEAGUES)) {
      const names = Object.keys(teams).sort(() => Math.random() - .5);
      for (let i = 0; i < names.length; i += 2) {
        const d = new Date(); d.setDate(d.getDate() + Math.floor(Math.random() * 4));
        d.setHours(slots[Math.floor(Math.random() * slots.length)], Math.random() < .5 ? 0 : 30, 0, 0);
        if (d.getTime() < Date.now() + 30 * 60000) d.setDate(d.getDate() + 1);
        const e = xg(teams[names[i]], teams[names[i + 1]]);
        S.matches.push({ id: S.nextId++, league, home: names[i], away: names[i + 1], kickoff: d.toISOString(), xh: e.h, xa: e.a, odds: oddsFor(e.h, e.a), status: "open" });
      }
    }
    S.matches.sort((a, b) => a.kickoff.localeCompare(b.kickoff));
  }
  S = load();
  if (S) { // older saves used Albanian league names
    const OLD = { "Kosovë · Superliga": "Kosovo · Superliga", "Shqipëri · Abissnet Superiore": "Albania · Abissnet Superiore", "Angli · Premier League": "England · Premier League", "Itali · Serie A": "Italy · Serie A", "Spanjë · La Liga": "Spain · La Liga" };
    for (const m of S.matches) if (OLD[m.league]) m.league = OLD[m.league];
  }
  if (!S) { S = { balance: 1000, matches: [], bets: [], nextId: 1, nextBet: 1, lastBonus: null }; newRound(); save(); }

  let league = "all", marketId = "1X2", picks = [], stake = "10", msg = null, view = "book", banner = null, flash = null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const money = (n) => { const [i, d] = Math.abs(n).toFixed(2).split("."); const s = lang === "en" ? [",", "."] : [".", ","]; return (n < 0 ? "-" : "") + i.replace(/\B(?=(\d{3})+(?!\d))/g, s[0]) + s[1] + d; };
  const pr = (n) => lang === "en" ? n.toFixed(2) : n.toFixed(2).replace(".", ",");
  const pad = (n) => String(n).padStart(2, "0");
  const fmt = (iso) => { const d = new Date(iso); return `${t.days[d.getDay()]}, ${pad(d.getDate())}.${pad(d.getMonth() + 1)} · ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const lg = (l) => { const [c, ...r] = l.split(" · "); return r.length && t.countries[c] ? [t.countries[c], ...r].join(" · ") : l; };
  const today = () => new Date().toDateString();
  const matchById = (id) => S.matches.find((m) => m.id === id);

  function renderChrome() {
    document.documentElement.lang = lang;
    document.querySelectorAll("#langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    const nav = { book: t.football, bets: t.myBets, results: t.results };
    document.querySelectorAll("#nav button").forEach((b) => { b.textContent = nav[b.dataset.view]; b.setAttribute("aria-current", b.dataset.view === view); });
    $("balLabel").textContent = t.balance; $("balance").textContent = money(S.balance);
    $("bonus").textContent = t.bonus; $("bonus").title = t.bonusTitle; $("bonus").hidden = S.lastBonus === today();
    $("flash").innerHTML = flash ? `<p class="msg ${flash.ok ? "ok" : "err"}">${esc(flash.ok || flash.err)}</p>` : "";
    $("notice").innerHTML = t.notice; $("playAll").textContent = t.play; $("slipTitle").textContent = t.slip; $("footer").textContent = t.footer;
  }

  function renderBook() {
    const market = markets().find((m) => m.id === marketId);
    const open = S.matches.filter((m) => m.status === "open");
    const leagues = [...new Set(open.map((m) => m.league))];
    $("chips").innerHTML = [["all", t.all], ...leagues.map((l) => [l, lg(l)])]
      .map(([v, x]) => `<button type="button" class="chip" data-league="${esc(v)}" aria-pressed="${league === v}">${esc(x)}</button>`).join("");
    $("tabs").innerHTML = markets().map((mk) => `<button type="button" class="tab" data-market="${mk.id}" aria-pressed="${marketId === mk.id}">${esc(mk.label)}</button>`).join("");
    const shown = league === "all" ? open : open.filter((m) => m.league === league);
    const cols = `cols-${market.sels.length}`;
    $("events").innerHTML = `<div class="ev-head"><span>${t.match}</span><div class="odds ${cols}">${market.heads.map((h) => `<span>${esc(h)}</span>`).join("")}</div></div>` +
      (shown.length ? shown.map((m) => `<div class="ev"><div class="ev-info"><div class="ev-meta">${fmt(m.kickoff)} · ${esc(lg(m.league))}</div><div class="ev-team">${esc(m.home)}</div><div class="ev-team">${esc(m.away)}</div></div>
        <div class="odds ${cols}">${market.sels.map((s) => `<button type="button" class="odd" data-m="${m.id}" data-s="${s}" aria-pressed="${picks.some((p) => p.m === m.id && p.s === s)}" aria-label="${esc(m.home)} – ${esc(m.away)}: ${esc(t.sel[s])} ${pr(m.odds[s])}">${pr(m.odds[s])}</button>`).join("")}</div></div>`).join("")
      : `<p class="empty">${esc(t.noOpen)}</p>`);
    renderSlip();
  }

  function renderSlip() {
    const total = picks.reduce((p, x) => p * matchById(x.m).odds[x.s], 1);
    const st = Number(String(stake).replace(",", ".")) || 0;
    $("count").textContent = picks.length;
    $("headOdds").textContent = picks.length ? `${t.odds} ${pr(total)}` : "";
    const m = msg ? `<p class="msg ${msg.ok ? "ok" : "err"}">${esc(msg.ok || msg.err)}</p>` : "";
    if (!picks.length) { $("slipBody").innerHTML = `<p class="empty">${esc(t.tap)}</p>${m}`; return; }
    $("slipBody").innerHTML = picks.map((p) => { const mt = matchById(p.m); return `<div class="pick"><div><div class="pick-sel">${esc(t.sel[p.s])}</div><div class="muted small">${esc(mt.home)} – ${esc(mt.away)}</div></div><b class="num">${pr(mt.odds[p.s])}</b><button type="button" class="x" data-remove="${p.m}" aria-label="${esc(t.remove)}">×</button></div>`; }).join("") +
      `<div class="row"><span>${picks.length > 1 ? fill(t.acc, { n: picks.length }) : t.single}</span><b class="num">${pr(total)}</b></div>
       <label class="stake" for="stake"><span>${t.stake}</span><input id="stake" type="number" min="1" step="1" inputmode="decimal" value="${esc(stake)}"></label>
       <div class="quick">${[5, 10, 50, 100].map((v) => `<button type="button" data-stake="${v}">${v}</button>`).join("")}</div>
       <div class="row"><span>${t.potential}</span><b class="win num" id="potential">${money(st * total)}</b></div>
       <button type="button" class="btn btn-accent block" id="place" ${st < 1 || st > S.balance ? "disabled" : ""}>${st > S.balance ? t.insufficient : t.place}</button>
       <button type="button" class="linkbtn" id="clear">${t.clear}</button>${m}`;
  }

  function renderBets() {
    const won = S.bets.filter((b) => b.status === "won");
    const staked = S.bets.reduce((s, b) => s + b.stake, 0);
    const paid = S.bets.reduce((s, b) => s + (b.payout || 0), 0);
    const ban = banner ? `<p class="msg ${banner.ok ? "ok" : "err"}">${esc(banner.ok || banner.err)}</p>` : "";
    $("view-bets").innerHTML = `<h1>${t.myBets}</h1>${ban}
      <div class="stats"><div class="card stat"><small>${t.bets}</small><b>${S.bets.length}</b></div><div class="card stat"><small>${t.won}</small><b>${won.length}</b></div>
      <div class="card stat"><small>${t.staked}</small><b>${money(staked)}</b></div><div class="card stat"><small>${t.pointsWon}</small><b>${money(paid)}</b></div></div>` +
      (S.bets.length ? `<div class="bets">${S.bets.slice().reverse().map((b) => `<article class="card bet ${b.status}">
        <div class="bet-top"><span>#${b.id} · ${fmt(b.at)}</span><span class="tag ${b.status}">${t.status[b.status]}</span></div>
        ${b.sels.map((s) => { const m = matchById(s.m); return `<div class="bsel"><span class="dot ${s.r}"></span><div><div>${esc(m.home)} – ${esc(m.away)} ${m.status === "done" ? `<b>(${m.hg}–${m.ag})</b>` : ""}</div><div class="muted small">${esc(t.short[s.s])} · ${fmt(m.kickoff)}</div></div><b class="num">${pr(s.price)}</b></div>`; }).join("")}
        <div class="bet-foot"><span>${t.stake} <b class="num">${money(b.stake)}</b></span><span>${t.odds} <b class="num">${pr(b.odds)}</b></span><span>${b.status === "open" ? t.potential : t.payout} <b class="num">${money(b.status === "open" ? b.potential : b.payout)}</b></span></div>
      </article>`).join("")}</div>` : `<p class="card empty">${esc(t.noBets)}</p>`);
  }

  function renderResults() {
    const done = S.matches.filter((m) => m.status === "done").slice(-40).reverse();
    const ban = banner ? `<p class="msg ok">${esc(banner.ok)}</p>` : "";
    $("view-results").innerHTML = `<h1>${t.results}</h1>${ban}` + (done.length ? `<div class="card results">${done.map((m) => `<div class="res"><span class="muted small">${esc(lg(m.league))} · ${fmt(m.kickoff)}</span><span>${esc(m.home)} <b>${m.hg} – ${m.ag}</b> ${esc(m.away)}</span></div>`).join("")}</div>` : `<p class="card empty">${esc(t.noResults)}</p>`);
  }

  function render() {
    renderChrome();
    for (const v of ["book", "bets", "results"]) $("view-" + v).hidden = view !== v;
    if (view === "book") renderBook(); else if (view === "bets") renderBets(); else renderResults();
  }

  function place() {
    const st = r2(Number(String(stake).replace(",", ".")));
    if (!(st >= 1)) { msg = { err: t.minStake }; return; }
    if (st > S.balance) { msg = { err: t.insufficient }; return; }
    const sels = picks.map((p) => ({ m: p.m, s: p.s, price: matchById(p.m).odds[p.s], r: "pending" }));
    const odds = r2(sels.reduce((x, s) => x * s.price, 1));
    const bet = { id: S.nextBet++, stake: st, odds, potential: r2(st * odds), payout: 0, status: "open", at: new Date().toISOString(), sels };
    S.balance = r2(S.balance - st); S.bets.push(bet); picks = [];
    msg = { ok: fill(t.placed, { id: bet.id, win: money(bet.potential) }) };
    save();
  }

  // Plays every open match that `pred` selects, settles bets, tops the list up with new matches.
  function settle(pred) {
    let wonCount = 0, lostCount = 0, paid = 0, played = 0;
    for (const m of S.matches) if (m.status === "open" && pred(m)) { m.hg = samplePois(m.xh); m.ag = samplePois(m.xa); m.status = "done"; played++; }
    for (const b of S.bets) {
      if (b.status !== "open") continue;
      for (const s of b.sels) { const m = matchById(s.m); if (m.status === "done") s.r = wins(s.s, m.hg, m.ag) ? "won" : "lost"; }
      if (b.sels.some((s) => s.r === "lost")) { b.status = "lost"; lostCount++; }
      else if (b.sels.every((s) => s.r === "won")) { b.status = "won"; b.payout = r2(b.stake * b.odds); S.balance = r2(S.balance + b.payout); paid += b.payout; wonCount++; }
    }
    // keep finished matches that bets still point to, drop the oldest others
    const used = new Set(S.bets.flatMap((b) => b.sels.map((s) => s.m)));
    const done = S.matches.filter((m) => m.status === "done" && !used.has(m.id));
    const dropIds = new Set(done.slice(0, Math.max(0, done.length - 120)).map((m) => m.id));
    S.matches = S.matches.filter((m) => !dropIds.has(m.id));
    if (S.matches.filter((m) => m.status === "open").length < 16) newRound();
    if (played) picks = picks.filter((p) => matchById(p.m)?.status === "open");
    save();
    return { wonCount, lostCount, paid, played };
  }
  function outcome(r) {
    return r.wonCount ? { ok: fill(t.youWon, { n: r.wonCount, p: money(r.paid) }) + (r.lostCount ? " · " + fill(t.lostN, { n: r.lostCount }) : "") }
      : r.lostCount ? { err: fill(t.lostN, { n: r.lostCount }) } : null;
  }
  // Automatic: matches are played once their kick-off time has passed.
  function autoUpdate() {
    const now = new Date().toISOString();
    const r = settle((m) => m.kickoff <= now);
    if (!r.played) return;
    flash = outcome(r) || { ok: fill(t.autoPlayed, { n: r.played }) };
    render();
  }
  function playAll() {
    const r = settle(() => true);
    picks = []; msg = null;
    const { wonCount, lostCount, paid } = r;
    if (wonCount || lostCount) {
      view = "bets";
      banner = wonCount ? { ok: fill(t.youWon, { n: wonCount, p: money(paid) }) + (lostCount ? " · " + fill(t.lostN, { n: lostCount }) : "") } : { err: fill(t.lostN, { n: lostCount }) };
    } else { view = "results"; banner = { ok: t.played }; }
    render();
    banner = null;
    window.scrollTo(0, 0);
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.lang) { lang = b.dataset.lang; t = T[lang]; try { localStorage.setItem(LANG_KEY, lang); } catch (err) {} msg = null; render(); return; }
    if (b.dataset.view) { view = b.dataset.view; msg = null; flash = null; render(); window.scrollTo(0, 0); return; }
    if (b.dataset.league) { league = b.dataset.league; renderBook(); return; }
    if (b.dataset.market) { marketId = b.dataset.market; renderBook(); return; }
    if (b.dataset.m) {
      const m = Number(b.dataset.m), s = b.dataset.s; msg = null;
      const same = picks.some((p) => p.m === m && p.s === s);
      picks = picks.filter((p) => p.m !== m); if (!same && picks.length < 20) picks.push({ m, s });
      renderBook(); return;
    }
    if (b.dataset.remove) { picks = picks.filter((p) => p.m !== Number(b.dataset.remove)); renderBook(); return; }
    if (b.dataset.stake) { stake = b.dataset.stake; renderSlip(); return; }
    if (b.id === "place") { place(); render(); return; }
    if (b.id === "clear") { picks = []; msg = null; renderBook(); return; }
    if (b.id === "slipHead") { $("slip").classList.toggle("open"); return; }
    if (b.id === "bonus") { if (S.lastBonus !== today()) { S.lastBonus = today(); S.balance = r2(S.balance + 100); save(); } renderChrome(); if (view === "book") renderSlip(); return; }
    if (b.id === "playAll") { playAll(); return; }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id !== "stake") return;
    stake = e.target.value;
    const total = picks.reduce((p, x) => p * matchById(x.m).odds[x.s], 1), st = Number(String(stake).replace(",", ".")) || 0;
    $("potential").textContent = money(st * total);
    const btn = $("place"); btn.disabled = st < 1 || st > S.balance; btn.textContent = st > S.balance ? t.insufficient : t.place;
  });
  autoUpdate();
  render();
  setInterval(autoUpdate, 60000);
})();
</script>
